services:
  sightglass:
    image: bazokhan/sightglass:${SIGHTGLASS_VERSION:-latest}
    ports:
      - "7777:7777"
    environment:
      SIGHTGLASS_PUBLIC_URL: ${SIGHTGLASS_PUBLIC_URL:?Set the public HTTPS URL}
      SIGHTGLASS_SECRET: ${SIGHTGLASS_SECRET:?Set a stable random installation secret}
      SIGHTGLASS_TRUST_PROXY: ${SIGHTGLASS_TRUST_PROXY:-true}
      SIGHTGLASS_DATABASE_PATH: /data/sightglass.db
    volumes:
      - sightglass-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  sightglass-data:
