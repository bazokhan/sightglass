name: Publish Docker image

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Existing synchronized SDK version to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate requested version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: test "$(node -p \"require('./packages/core/package.json').version\")" = "$VERSION"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            sightglasshq/sightglass:${{ inputs.version }}
            sightglasshq/sightglass:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
